name: release container

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify built package
        run: |
          python -m venv /tmp/scc-release-check
          wheel=$(ls dist/*.whl)
          /tmp/scc-release-check/bin/pip install "${wheel}[tokenizers]"
          /tmp/scc-release-check/bin/acg --help
          /tmp/scc-release-check/bin/acg optimize \
            --repo examples/sample_repo \
            --task-type iac_security \
            --path terraform/prod/payments/lambda.tf \
            --prompt "Review security risk" \
            --provider openai \
            --tokenizer tiktoken:o200k_base \
            --token-budget 100 \
            --out /tmp/scc-release-check/optimization.json
      - name: Attach package files to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          make_latest: true

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/krishnamuppidi/secure-context-cache
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

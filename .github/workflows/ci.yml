name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,api]"
      - run: pytest -q
      - run: python -m compileall src tests examples
      - run: ruff check src tests examples

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - run: terraform -chdir=deploy/aws/terraform fmt -check
      - run: terraform -chdir=deploy/aws/terraform init -backend=false -input=false
      - run: terraform -chdir=deploy/aws/terraform validate
      - run: bash -n deploy/aws/*.sh

[project]
name = "secure-context-cache"
version = "0.5.0"
description = "Secure token-optimization framework with a deployable Agent Context Gateway for enterprise AI agents."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{ name = "Naga Krishna Reddy Muppidi" }]
dependencies = []

[project.urls]
Homepage = "https://krishnamuppidi.github.io/secure-context-cache/"
Repository = "https://github.com/krishnamuppidi/secure-context-cache"

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
aws = ["boto3>=1.34", "fastapi>=0.110", "mangum>=0.17"]
dev = ["httpx>=0.27", "pytest>=8.0", "ruff>=0.5"]

[project.scripts]
acg = "agent_context_gateway.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

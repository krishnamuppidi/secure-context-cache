[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-context-cache"
version = "0.7.0"
description = "Open-source token-optimization framework with secure context selection, reuse, compression adapters, provider caching, and quality gates."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Naga Krishna Reddy Muppidi" }]
dependencies = []

[project.urls]
Homepage = "https://krishnamuppidi.github.io/secure-context-cache/"
Repository = "https://github.com/krishnamuppidi/secure-context-cache"

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
aws = ["boto3>=1.34", "fastapi>=0.110", "mangum>=0.17"]
tokenizers = ["tiktoken>=0.9"]
compression = ["llmlingua>=0.2.2,<0.3"]
dev = ["build>=1.2", "httpx>=0.27", "pillow>=10", "pytest>=8.0", "ruff>=0.5"]

[project.scripts]
acg = "agent_context_gateway.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
